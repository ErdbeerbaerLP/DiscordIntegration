plugins {
    id 'dev.architectury.loom-no-remap' version '1.17.+' apply false
    id 'architectury-plugin' version '3.5.+'
    id 'com.gradleup.shadow' version '9+' apply false
    id "com.modrinth.minotaur" version "2.+" apply false
    id 'net.darkhax.curseforgegradle' version "1.1.28" apply false
}
architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version


}


subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    apply plugin: 'com.modrinth.minotaur'
    apply plugin: 'com.gradleup.shadow'
    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name-MC$rootProject.minecraft_version"
    }
    tasks.register('release') {

    }
    repositories {
        maven { url "https://repo.erdbeerbaerlp.de/repository/maven-public/" }

    }
    configurations.configureEach {
        resolutionStrategy.cacheDynamicVersionsFor 3, 'minutes'
        resolutionStrategy.cacheChangingModulesFor 3, 'minutes'
    }
    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
    }
    jar {
        archiveClassifier = "raw"
    }
    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }


}